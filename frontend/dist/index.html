  <body class="bg-surface text-on-surface font-body-md overflow-x-hidden">

  <!-- WIDGET TÌM KIẾM NỘI BỘ KIỂU GOOGLE -->
<div id="floating-search-widget" style="position: fixed; bottom: 20px; right: 20px; z-index: 999999; font-family: system-ui, -apple-system, sans-serif;">
  
  <!-- Nút Kính Lúp Nổi Mở Tìm Kiếm -->
  <button id="toggleSearchBtn" style="display: flex; items-center; gap: 8px; background-color: #008751; color: white; border: none; padding: 12px 22px; border-radius: 9999px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s ease;">
    <span style="font-size: 16px;">🔍</span>
    <span>Tìm kiếm</span>
  </button>

  <!-- Khung Modal Tìm Kiếm Trải Rộng (Google Style) -->
  <div id="searchBoxContainer" style="display: none; position: fixed; bottom: 80px; right: 20px; width: 420px; max-width: 92vw; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); padding: 18px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid #e5e7eb;">
    
    <!-- Header Khung Tìm Kiếm -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f3f4f6;">
      <span style="font-size: 13px; font-weight: 700; color: #008751; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px;">
        🔍 TÌM KIẾM NỘI BỘ VIETITALIA
      </span>
      <button id="closeSearchBtn" style="background: transparent; border: none; font-size: 16px; font-weight: bold; color: #9ca3af; cursor: pointer; padding: 2px 8px; border-radius: 6px;">✕</button>
    </div>

    <!-- Ô Nhập Từ Khóa -->
    <div style="position: relative; margin-bottom: 10px;">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Gõ từ khóa (ví dụ: Genoa, Du lịch, Đại sứ...)" 
        style="width: 100%; padding: 11px 14px; font-size: 14px; border: 1.5px solid #d1d5db; border-radius: 12px; outline: none; background-color: #f9fafb; color: #111827; box-sizing: border-box; transition: border-color 0.2s;"
      />
    </div>

    <!-- Thông báo Số kết quả -->
    <div id="searchMetaStatus" style="font-size: 11px; color: #6b7280; font-weight: 600; margin-bottom: 8px; display: none;"></div>

    <!-- Danh Sách Kết Quả Trả Về (Thẻ Bài Viết) -->
    <div id="searchResults" style="display: none; max-height: 320px; overflow-y: auto; background: #ffffff; border-radius: 12px; border: 1px solid #f3f4f6; divide-y: 1px solid #f3f4f6;">
    </div>
  </div>
</div>

<!-- WIDGET TÌM KIẾM TOÀN DỮ LIỆU QUA BACKEND API -->
<script>
(function() {
  function injectWidget() {
    if (document.getElementById('floating-search-widget')) return;

    const widget = document.createElement('div');
    widget.id = 'floating-search-widget';
    widget.style.cssText = 'position: fixed; bottom: 20px; right: 20px; z-index: 999999; font-family: system-ui, -apple-system, sans-serif;';

    widget.innerHTML = `
      <button id="toggleSearchBtn" type="button" style="display: flex; align-items: center; gap: 8px; background-color: #008751; color: white; border: none; padding: 12px 22px; border-radius: 9999px; box-shadow: 0 10px 20px rgba(0,0,0,0.25); cursor: pointer; font-size: 14px; font-weight: 600;">
        <span style="font-size: 16px;">🔍</span>
        <span>Tìm kiếm</span>
      </button>

      <div id="searchBoxContainer" style="display: none; position: fixed; bottom: 80px; right: 20px; width: 420px; max-width: 90vw; background: #ffffff; padding: 18px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3); border: 1px solid #e5e7eb;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f3f4f6;">
          <span style="font-size: 13px; font-weight: 700; color: #008751; text-transform: uppercase;">🔍 TÌM KIẾM TOÀN TRANG VIETITALIA</span>
          <button id="closeSearchBtn" type="button" style="background: transparent; border: none; font-size: 18px; font-weight: bold; color: #9ca3af; cursor: pointer; padding: 2px 8px;">✕</button>
        </div>

        <input type="text" id="searchInput" placeholder="Nhập từ khóa tìm kiếm toàn trang..." style="width: 100%; padding: 11px 14px; font-size: 14px; border: 1.5px solid #d1d5db; border-radius: 12px; outline: none; background-color: #f9fafb; color: #111827; box-sizing: border-box;" />

        <div id="searchMetaStatus" style="font-size: 11px; color: #6b7280; font-weight: 600; margin-top: 8px; display: none;"></div>
        <div id="searchResults" style="display: none; max-height: 320px; overflow-y: auto; margin-top: 8px; background: #ffffff; border-radius: 12px; border: 1px solid #f3f4f6;"></div>
      </div>
    `;

    document.body.appendChild(widget);
  }

  // Lắng nghe Click nút Toggle & Đóng
  document.addEventListener('click', function(e) {
    const toggleBtn = e.target.closest('#toggleSearchBtn');
    const closeBtn = e.target.closest('#closeSearchBtn');
    const boxContainer = document.getElementById('searchBoxContainer');
    const searchInput = document.getElementById('searchInput');

    if (toggleBtn) {
      e.preventDefault();
      if (boxContainer) {
        const isHidden = boxContainer.style.display === 'none' || !boxContainer.style.display;
        boxContainer.style.display = isHidden ? 'block' : 'none';
        if (isHidden && searchInput) searchInput.focus();
      }
    } else if (closeBtn) {
      e.preventDefault();
      if (boxContainer) boxContainer.style.display = 'none';
    }
  });

  // Gửi Request Tới API Backend Khi Gõ Chữ
  let debounceTimer;
  document.addEventListener('input', function(e) {
    if (e.target && e.target.id === 'searchInput') {
      clearTimeout(debounceTimer);
      const keyword = e.target.value.trim();
      const searchResults = document.getElementById('searchResults');
      const searchMetaStatus = document.getElementById('searchMetaStatus');

      if (!keyword) {
        if (searchResults) searchResults.style.display = 'none';
        if (searchMetaStatus) searchMetaStatus.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(() => {
        fetch('/api/search?q=' + encodeURIComponent(keyword))
          .then(res => res.json())
          .then(data => {
            if (!searchResults) return;

            if (searchMetaStatus) {
              searchMetaStatus.style.display = 'block';
              searchMetaStatus.innerText = 'Tìm thấy ' + (data.results ? data.results.length : 0) + ' kết quả cho "' + keyword + '"';
            }

            if (!data.results || data.results.length === 0) {
              searchResults.style.display = 'block';
              searchResults.innerHTML = '<div style="padding: 14px; font-size: 13px; color: #6b7280; text-align: center;">Không tìm thấy bài viết nào chứa từ "<b>' + keyword + '</b>".</div>';
            } else {
              searchResults.style.display = 'block';
              searchResults.innerHTML = data.results.map(item => `
                <a href="${item.url}" style="display: block; padding: 12px 14px; text-decoration: none; border-bottom: 1px solid #f3f4f6;" onmouseover="this.style.backgroundColor='#f0fdf4'" onmouseout="this.style.backgroundColor='transparent'">
                  <div style="font-size: 10px; font-weight: 700; color: #008751; text-transform: uppercase;">${item.category || 'TIN TỨC'}</div>
                  <div style="font-size: 13.5px; font-weight: 700; color: #111827; margin: 2px 0;">${item.title}</div>
                  <div style="font-size: 12px; color: #4b5563; line-height: 1.4;">${item.summary || ''}</div>
                </a>
              `).join('');
            }
          })
          .catch(() => {
            if (searchResults) {
              searchResults.style.display = 'block';
              searchResults.innerHTML = '<div style="padding: 14px; font-size: 13px; color: #ef4444; text-align: center;">Đang kết nối tới máy chủ...</div>';
            }
          });
      }, 250);
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectWidget);
  } else {
    injectWidget();
  }
})();
</script>
