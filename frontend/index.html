<html class="scroll-smooth" lang="vi">

    <meta

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        theme: {

            colors: {

              "on-tertiary-fixed-variant": "#574500",

              "inverse-on-surface": "#f0f1f2",
              secondary: "#006d34",
              "on-primary-container": "#ffb8b8",

              "surface-container-low": "#f3f4f5",
              outline: "#8d7070",

              "surface-container": "#edeeef",
              "surface-dim": "#d9dadb",

              "surface-bright": "#f8f9fa",

              "on-surface": "#191c1d",

              "on-tertiary": "#ffffff",

              "on-primary": "#ffffff",

    <link rel="stylesheet" href="/src/assets/css/style.css" />
  </head>
  <body class="bg-surface text-on-surface font-body-md overflow-x-hidden">
<header id="app-header" class="sticky top-0 z-50 bg-white border-b border-gray-100 py-3 px-4">
  <div id="internal-search-box" class="relative max-w-md w-full mx-auto my-3 px-4">
  <div class="relative">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Tìm kiếm bài viết, sự kiện VietItalia..." 
      class="w-full pl-10 pr-4 py-2 text-sm border border-gray-300 rounded-full focus:outline-none focus:border-[#008751] focus:ring-1 focus:ring-[#008751] transition-all"
    />
    <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
    </svg>
  </div>

  <div id="searchResults" class="hidden absolute left-0 right-0 top-full mt-2 bg-white border border-gray-200 rounded-2xl shadow-xl max-h-80 overflow-y-auto z-50 divide-y divide-gray-100">
  </div>
</div>
</header>
    <main id="app-root"></main>
    <footer id="app-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  <!-- WIDGET TÌM KIẾM NỘI BỘ KIỂU GOOGLE -->
<div id="floating-search-widget" style="position: fixed; bottom: 20px; right: 20px; z-index: 999999; font-family: system-ui, -apple-system, sans-serif;">
  
  <!-- Nút Kính Lúp Nổi Mở Tìm Kiếm -->
  <button id="toggleSearchBtn" style="display: flex; items-center; gap: 8px; background-color: #008751; color: white; border: none; padding: 12px 22px; border-radius: 9999px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s ease;">
    <span style="font-size: 16px;">🔍</span>
    <span>Tìm kiếm</span>
  </button>

  <!-- Khung Modal Tìm Kiếm Trải Rộng (Google Style) -->
  <div id="searchBoxContainer" style="display: none; position: fixed; bottom: 80px; right: 20px; width: 420px; max-width: 92vw; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); padding: 18px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid #e5e7eb;">
    
    <!-- Header Khung Tìm Kiếm -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f3f4f6;">
      <span style="font-size: 13px; font-weight: 700; color: #008751; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px;">
        🔍 TÌM KIẾM NỘI BỘ VIETITALIA
      </span>
      <button id="closeSearchBtn" style="background: transparent; border: none; font-size: 16px; font-weight: bold; color: #9ca3af; cursor: pointer; padding: 2px 8px; border-radius: 6px;">✕</button>
    </div>

    <!-- Ô Nhập Từ Khóa -->
    <div style="position: relative; margin-bottom: 10px;">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Gõ từ khóa (ví dụ: Genoa, Du lịch, Đại sứ...)" 
        style="width: 100%; padding: 11px 14px; font-size: 14px; border: 1.5px solid #d1d5db; border-radius: 12px; outline: none; background-color: #f9fafb; color: #111827; box-sizing: border-box; transition: border-color 0.2s;"
      />
    </div>

    <!-- Thông báo Số kết quả -->
    <div id="searchMetaStatus" style="font-size: 11px; color: #6b7280; font-weight: 600; margin-bottom: 8px; display: none;"></div>

    <!-- Danh Sách Kết Quả Trả Về (Thẻ Bài Viết) -->
    <div id="searchResults" style="display: none; max-height: 320px; overflow-y: auto; background: #ffffff; border-radius: 12px; border: 1px solid #f3f4f6; divide-y: 1px solid #f3f4f6;">
    </div>
  </div>
</div>

<script>
  (function() {
    // Cơ sở dữ liệu bài viết & các trang nội bộ mặc định của VietItalia
    let defaultDatabase = [
      {
        title: "Hội nghị Genoa – Đà Nẵng thúc đẩy hợp tác địa phương",
        category: "SỰ KIỆN",
        url: "/events",
        summary: "Hội nghị tại Genoa (Ý) đánh dấu bước cụ thể hóa hợp tác giữa hai thành phố, thúc đẩy ngoại giao kinh tế và văn hóa."
      },
      {
        title: "Chương trình Đại sứ Văn hóa VietItalia 2026",
        category: "ĐẠI SỨ",
        url: "/ambassador",
        summary: "Kết nối thế hệ trẻ, tôn vinh mối quan hệ ngoại giao và giao lưu văn hóa, giáo dục Việt Nam - Ý."
      },
      {
        title: "Chương trình Đào tạo Quốc tế & Học bổng Du học Ý",
        category: "ĐÀO TẠO QUỐC TẾ",
        url: "/international-training",
        summary: "Cung cấp thông tin tuyển sinh, liên kết đào tạo cử nhân, thạc sĩ và học bổng du học Ý."
      },
      {
        title: "Thị trường nước Ý & Cơ hội Giao thương Doanh nghiệp",
        category: "THỊ TRƯỜNG Ý",
        url: "/italy-market",
        summary: "Tổng quan kinh tế, xuất nhập khẩu và các cơ hội đầu tư kinh doanh giữa doanh nghiệp Việt Nam và Italia."
      },
      {
        title: "Thị trường Việt Nam & Nhu cầu Kết nối Doanh nghiệp Ý",
        category: "THỊ TRƯỜNG VIỆT NAM",
        url: "/vietnam-market",
        summary: "Thông tin hỗ trợ các doanh nghiệp Ý muốn tìm hiểu môi trường đầu tư và mở rộng thị trường tại Việt Nam."
      },
      {
        title: "Business Matching - Kết nối Giao thương Doanh nghiệp Việt - Ý",
        category: "KẾT NỐI KINH DOANH",
        url: "/business-matching",
        summary: "Dịch vụ cầu nối trực tiếp giữa các đối tác, doanh nghiệp Việt Nam và các hiệp hội, tổ chức Ý."
      },
      {
        title: "Du lịch Ý & Hành trình Trải nghiệm Văn hóa",
        category: "DU LỊCH Ý",
        url: "/italy-travel",
        summary: "Khám phá các di sản văn hóa, ẩm thực, địa điểm du lịch nổi tiếng tại Cộng hòa Italia."
      },
      {
        title: "Về chúng tôi - VietItalia Bridge",
        category: "GIỚI THIỆU",
        url: "/about",
        summary: "Tổ chức cầu nối văn hóa, giáo dục và kinh doanh song phương giữa Việt Nam và Italia."
      },
      {
        title: "Liên hệ & Hợp tác VietItalia",
        category: "LIÊN HỆ",
        url: "/contact",
        summary: "Thông tin văn phòng liên hệ tại Feltre (BL) - Italia và hỗ trợ trực tuyến."
      }
    ];

    let searchDatabase = [...defaultDatabase];

    // Tự động tải thêm bài viết từ file JSON (nếu có trên server)
    fetch('/data/posts.json')
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          searchDatabase = [...data, ...defaultDatabase];
        }
      })
      .catch(() => {});

    function setupGoogleStyleSearch() {
      const toggleBtn = document.getElementById('toggleSearchBtn');
      const closeBtn = document.getElementById('closeSearchBtn');
      const boxContainer = document.getElementById('searchBoxContainer');
      const searchInput = document.getElementById('searchInput');
      const searchResults = document.getElementById('searchResults');
      const searchMetaStatus = document.getElementById('searchMetaStatus');

      if (!toggleBtn || !boxContainer) return;

      // 1. Mở / Đóng khung tìm kiếm
      toggleBtn.onclick = function(e) {
        e.stopPropagation();
        if (boxContainer.style.display === 'none' || boxContainer.style.display === '') {
          boxContainer.style.display = 'block';
          if (searchInput) searchInput.focus();
        } else {
          boxContainer.style.display = 'none';
        }
      };

      if (closeBtn) {
        closeBtn.onclick = function(e) {
          e.stopPropagation();
          boxContainer.style.display = 'none';
        };
      }

      // 2. Logic Tìm kiếm Kiểu Google
      if (searchInput && searchResults) {
        searchInput.oninput = function(e) {
          const keyword = e.target.value.trim().toLowerCase();

          if (!keyword) {
            searchResults.style.display = 'none';
            searchResults.innerHTML = '';
            if (searchMetaStatus) searchMetaStatus.style.display = 'none';
            return;
          }

          // Lọc nội dung khớp theo Tiêu đề, Tóm tắt hoặc Chuyên mục
          const filtered = searchDatabase.filter(item => {
            const titleMatch = item.title && item.title.toLowerCase().includes(keyword);
            const summaryMatch = item.summary && item.summary.toLowerCase().includes(keyword);
            const categoryMatch = item.category && item.category.toLowerCase().includes(keyword);
            return titleMatch || summaryMatch || categoryMatch;
          });

          // Hiển thị trạng thái số lượng kết quả tìm thấy
          if (searchMetaStatus) {
            searchMetaStatus.style.display = 'block';
            searchMetaStatus.innerText = 'Tìm thấy ' + filtered.length + ' kết quả cho "' + keyword + '"';
          }

          // Render Kết Quả
          if (filtered.length === 0) {
            searchResults.style.display = 'block';
            searchResults.innerHTML = '<div style="padding: 16px; font-size: 13px; color: #6b7280; text-align: center;">Không tìm thấy bài viết nào phù hợp với từ khóa "<b>' + keyword + '</b>".</div>';
          } else {
            searchResults.style.display = 'block';
            searchResults.innerHTML = filtered.map(item => `
              <a href="${item.url || '#'}" style="display: block; padding: 12px 14px; text-decoration: none; border-bottom: 1px solid #f3f4f6; transition: background-color 0.15s ease;" onmouseover="this.style.backgroundColor='#f0fdf4'" onmouseout="this.style.backgroundColor='transparent'">
                <div style="font-size: 10px; font-weight: 700; color: #008751; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px;">
                  ${item.category || 'TIN TỨC'}
                </div>
                <div style="font-size: 13.5px; font-weight: 700; color: #111827; margin-bottom: 4px; line-height: 1.35;">
                  ${item.title}
                </div>
                ${item.summary ? `<div style="font-size: 11.5px; color: #4b5563; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${item.summary}</div>` : ''}
                <div style="font-size: 11px; font-weight: 600; color: #008751; margin-top: 5px; display: flex; align-items: center; gap: 4px;">
                  <span>Xem chi tiết</span> ➔
                </div>
              </a>
            `).join('');
          }
        };
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupGoogleStyleSearch);
    } else {
      setupGoogleStyleSearch();
    }
  })();
</script>
</body>
</html>
